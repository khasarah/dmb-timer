<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<title>DMB-Timer • @Khasarah</title>
	<link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
	<content class="screen">
		<span id="background"></span>
		<div class="overlay"></div>
		<div class="clock" id="clock">
			<span class="clock__header">- Left • <span id="clock__percentage">100%</span> • Until -</span>
			<div class="clock__time" id="timer">
				<span id="days">000</span><span class="clock__until">d</span>
				<span id="hours">00</span><span class="clock__until">h</span>
				<span id="minutes">00</span><span class="clock__until">m</span>
				<span id="seconds">00</span><span class="clock__until">s</span>
			</div>
			<p class="clock__footer">- 16 april 2027 -</p>
		</div>
		<p class="tag">- Timer until @khasarah returns -</p>
	</content>
	<script src="script.js"></script>
</body>
</html>
